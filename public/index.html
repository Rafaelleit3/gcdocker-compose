<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="add-product.html">Cadastrar Produto</a></li>
    </ul>
  </nav>

  <h1>Produtos</h1>
  <div id="product-gallery"></div>

  <h2>Carrinho</h2>
  <ul id="cart-list"></ul>
  <button onclick="clearCart()">Limpar Carrinho</button>

  <script>
    async function fetchProducts() {
      const response = await fetch('/products');
      const products = await response.json();
      const productGallery = document.getElementById('product-gallery');
      productGallery.innerHTML = '';
      products.forEach(product => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <span>${product.name} - R$ ${product.price}</span>
          <button class="add-to-cart-button" onclick="addToCart(${product.id})">Adicionar ao carrinho</button>`;
        productGallery.appendChild(div);
      });
    }

    async function fetchCart() {
      const response = await fetch('/cart');
      const cart = await response.json();
      const cartList = document.getElementById('cart-list');
      cartList.innerHTML = '';
      cart.forEach(product => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${product.name} - R$ ${product.price}</span>
          <button class="remove-button" onclick="removeFromCart(${product.id})">Remover</button>`;
        cartList.appendChild(li);
      });
    }

    async function addToCart(id) {
      const response = await fetch(`/products`);
      const products = await response.json();
      const product = products.find(p => p.id === id);
      if (product) {
        await fetch('/cart/add', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            productId: product.id,
            quantity: 1,
            price: product.price
          })
        });
        fetchCart();
      }
    }

    async function removeFromCart(id) {
      await fetch(`/cart/remove/${id}`, {
        method: 'DELETE'
      });
      fetchCart();
    }

    async function clearCart() {
      await fetch('/cart/clear', {
        method: 'DELETE'
      });
      fetchCart();
    }

    fetchProducts();
    fetchCart();
  </script>
</body>
</html>
